# Release: pushing a version tag (for example `git tag v0.2.0 && git push origin v0.2.0`) builds a signed release APK
# and publishes it as a GitHub Release with auto-written notes and a SHA-256 checksum. See docs/release.md.
#
# It needs four repository secrets (Settings → Secrets and variables → Actions):
#   SMARAN_UPLOAD_KEYSTORE_BASE64   the upload keystore file, base64-encoded
#   SMARAN_UPLOAD_STORE_PASSWORD
#   SMARAN_UPLOAD_KEY_ALIAS
#   SMARAN_UPLOAD_KEY_PASSWORD
# Without them the release stops. It never publishes a debug-signed APK.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # to create the release and upload the APK

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(node -p "require('./app.json').expo.version")
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$APP" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app.json ($APP) and package.json ($PKG). Bump both, commit, and tag again."
            exit 1
          fi

      - name: Check the signing secrets are set
        env:
          KEYSTORE: ${{ secrets.SMARAN_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SMARAN_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMARAN_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMARAN_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::A signing secret is missing. See docs/release.md, \"Releasing with GitHub Actions\"."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle's downloads between releases, which makes later builds much faster.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npx jest --ci

      - name: Type checks
        run: npm run typecheck

      - name: Restore the upload key
        env:
          KEYSTORE: ${{ secrets.SMARAN_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/smaran-upload.keystore"

      # Gradle reads ORG_GRADLE_PROJECT_<name> environment variables as project properties, the same ones
      # plugins/withReleaseSigning.js reads from ~/.gradle/gradle.properties on a laptop.
      - name: Build the signed APK
        env:
          ORG_GRADLE_PROJECT_SMARAN_UPLOAD_STORE_FILE: ${{ runner.temp }}/smaran-upload.keystore
          ORG_GRADLE_PROJECT_SMARAN_UPLOAD_STORE_PASSWORD: ${{ secrets.SMARAN_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SMARAN_UPLOAD_KEY_ALIAS: ${{ secrets.SMARAN_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SMARAN_UPLOAD_KEY_PASSWORD: ${{ secrets.SMARAN_UPLOAD_KEY_PASSWORD }}
        run: npm run apk

      - name: Check it's signed with the upload key, not the debug key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs dist/smaran.apk | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is debug-signed. Check the signing secrets."
            exit 1
          fi

      - name: Name the APK and write its checksum
        run: |
          APK="smaran-$GITHUB_REF_NAME.apk"
          mv dist/smaran.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          cat "dist/$APK.sha256"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a dash, such as v0.2.0-beta.1, is marked as a pre-release.
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "dist/smaran-$GITHUB_REF_NAME.apk" \
            "dist/smaran-$GITHUB_REF_NAME.apk.sha256" \
            --title "Smaran $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            $PRERELEASE
