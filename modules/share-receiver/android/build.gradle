// Gradle build for the share receiver: a small Android library that autolinking adds to the app
// because modules/share-receiver has an expo-module.config.json. The config plugin adds its manifest entries.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.smaran'
version = '1.0.0'

android {
  namespace "app.smaran.share"
}

dependencies {
  // HeadlessJsTaskService lives in React Native's Android library.
  implementation 'com.facebook.react:react-android'
}
